<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- No background - transparent -->
  
  <!-- Game controller icon -->
  <g transform="translate(150, 200)">
    <!-- Controller body -->
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#6b7280" opacity="0.3"/>
    
    <!-- Left buttons (D-pad) -->
    <rect x="-45" y="-5" width="15" height="5" fill="#6b7280" opacity="0.5"/>
    <rect x="-40" y="-10" width="5" height="15" fill="#6b7280" opacity="0.5"/>
    
    <!-- Right buttons -->
    <circle cx="30" cy="-8" r="4" fill="#6b7280" opacity="0.5"/>
    <circle cx="45" cy="-8" r="4" fill="#6b7280" opacity="0.5"/>
    <circle cx="30" cy="8" r="4" fill="#6b7280" opacity="0.5"/>
    <circle cx="45" cy="8" r="4" fill="#6b7280" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="260" text-anchor="middle" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="16" opacity="0.7">
    Aucune image
  </text>
  <text x="150" y="280" text-anchor="middle" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="16" opacity="0.7">
    disponible
  </text>
  
  <!-- Dark mode text -->
  <text x="150" y="260" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16" opacity="0" class="dark:opacity-70">
    Aucune image
  </text>
  <text x="150" y="280" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16" opacity="0" class="dark:opacity-70">
    disponible
  </text>
  
  <style>
    @media (prefers-color-scheme: dark) {
      .dark\:opacity-100 { opacity: 1; }
      .dark\:opacity-70 { opacity: 0.7; }
    }
  </style>
</svg>